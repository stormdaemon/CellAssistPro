<!doctype html>
<html lang="fr">
  <head><meta charset="utf-8" /><title>Formulaires CelAssistPro</title></head>
  <body>
    <!-- Déclaration statique pour la détection Netlify Forms.
         Le vrai formulaire est rendu par React et poste ici en fetch. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="nom" />
      <input type="email" name="email" />
      <input type="tel" name="telephone" />
      <select name="secteur"></select>
      <select name="anciennete"></select>
      <select name="besoin"></select>
      <textarea name="message"></textarea>
      <select name="origine"></select>
    </form>
  </body>
</html>
